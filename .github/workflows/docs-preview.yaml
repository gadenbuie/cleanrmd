name: Preview documentation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: cleanrmd-docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check for documentation changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - "docs/**"
              - "man/**"
              - "R/**"
              - "inst/**"
              - "DESCRIPTION"
              - "NAMESPACE"

  render:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/render-docs.yaml
    permissions:
      contents: read

  deploy:
    needs: render
    if: needs.render.outputs.valid == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: cleanrmd-docs-site
          path: publish

      - name: Deploy PR preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: publish
          target-folder: pr-${{ github.event.pull_request.number }}
          clean: true
          force: false
          attempt-limit: 5

      - name: Find existing preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- cleanrmd-docs-preview -->"

      - name: Create or update preview comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- cleanrmd-docs-preview -->
            Documentation preview for this pull request:
            https://pkg.garrickadenbuie.com/cleanrmd/pr-${{ github.event.pull_request.number }}/

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git rm -r --ignore-unmatch "pr-${PR_NUMBER}"
          if git diff --cached --quiet; then
            echo "No preview files found for PR #${PR_NUMBER}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove docs preview for PR #${PR_NUMBER}"

          # Another preview may update gh-pages while this cleanup runs.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done

      - name: Find existing preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- cleanrmd-docs-preview -->"

      - name: Mark preview comment as cleaned up
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- cleanrmd-docs-preview -->
            The documentation preview files for this pull request have been cleaned up because the pull request was closed.

      - name: Minimize preview comment as outdated
        if: steps.find-comment.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ steps.find-comment.outputs.comment-id }}
        run: |
          comment_node_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .node_id)
          gh api graphql \
            -f query='mutation($subjectId: ID!) { minimizeComment(input: {subjectId: $subjectId, classifier: OUTDATED}) { minimizedComment { isMinimized minimizedReason } } }' \
            -f subjectId="$comment_node_id"
